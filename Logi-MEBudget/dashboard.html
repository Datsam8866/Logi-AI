<!DOCTYPE html>
<html lang="zh-TW" data-theme="business-light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ME Budget FY27 — Q1 Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── Design Tokens ── */
[data-theme="business-light"] {
  --bg-page: #F7F9FA;
  --bg-card: #FFFFFF;
  --bg-header: #FFFFFF;
  --text-primary: #263238;
  --text-secondary: #546E7A;
  --text-muted: #78909C;
  --accent: #00897B;
  --accent-hover: #00695C;
  --kpi-value: #00897B;
  --border: #CFD8DC;
  --bar-top: #64FFDA;
  --row-hover: #F0F9F8;
  --ok-bg: rgba(0,137,123,0.08);
  --ok-text: #00695C;
  --ok-border: rgba(0,137,123,0.25);
  --warn-bg: rgba(230,81,0,0.07);
  --warn-text: #BF360C;
  --warn-border: rgba(230,81,0,0.22);
  --danger-bg: rgba(198,40,40,0.07);
  --danger-text: #B71C1C;
  --danger-border: rgba(198,40,40,0.22);
  --neutral-bg: #ECEFF1;
  --neutral-text: #546E7A;
  --neutral-border: #B0BEC5;
  --pipe-bg: rgba(245,124,0,0.08);
  --pipe-text: #E65100;
  --pipe-border: rgba(245,124,0,0.25);
  --exp-bg: rgba(126,87,194,0.08);
  --exp-text: #4527A0;
  --exp-border: rgba(126,87,194,0.22);
  --shadow: 0 1px 4px rgba(38,50,56,0.08);
}
[data-theme="business-dark"] {
  --bg-page: #263238;
  --bg-card: #37474F;
  --bg-header: #1C272C;
  --text-primary: #FFFFFF;
  --text-secondary: #B0BEC5;
  --text-muted: #78909C;
  --accent: #64FFDA;
  --accent-hover: #1DE9B6;
  --kpi-value: #64FFDA;
  --border: #455A64;
  --bar-top: #64FFDA;
  --row-hover: rgba(100,255,218,0.05);
  --ok-bg: rgba(100,255,218,0.1);
  --ok-text: #64FFDA;
  --ok-border: rgba(100,255,218,0.25);
  --warn-bg: rgba(255,183,77,0.1);
  --warn-text: #FFB74D;
  --warn-border: rgba(255,183,77,0.25);
  --danger-bg: rgba(239,154,154,0.1);
  --danger-text: #EF9A9A;
  --danger-border: rgba(239,154,154,0.25);
  --neutral-bg: rgba(69,90,100,0.6);
  --neutral-text: #90A4AE;
  --neutral-border: #546E7A;
  --pipe-bg: rgba(255,183,77,0.1);
  --pipe-text: #FFB74D;
  --pipe-border: rgba(255,183,77,0.25);
  --exp-bg: rgba(179,157,219,0.1);
  --exp-text: #CE93D8;
  --exp-border: rgba(179,157,219,0.25);
  --shadow: 0 2px 10px rgba(0,0,0,0.35);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
  background: var(--bg-page);
  color: var(--text-primary);
  font-size: 0.88rem;
  line-height: 1.6;
  transition: background .22s, color .22s;
}

/* Breakthrough Bar */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: var(--bar-top);
  z-index: 1000;
}

/* ── Header ── */
header {
  position: sticky;
  top: 4px;
  z-index: 100;
  background: var(--bg-header);
  border-bottom: 2px solid var(--border);
  padding: 13px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow);
  transition: background .22s, border-color .22s;
}
.header-left h1 { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; }
.header-left p { font-size: 0.76rem; color: var(--text-muted); margin-top: 1px; }
.mode-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: transparent;
  color: var(--text-secondary);
  font-family: inherit; font-size: 0.8rem; font-weight: 500;
  cursor: pointer; transition: all .18s;
}
.mode-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ── Main ── */
main { max-width: 1100px; margin: 0 auto; padding: 26px 32px 52px; }

/* ── Deadline Chips ── */
.deadline-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 22px; }
.dl-chip {
  display: flex; align-items: center; gap: 7px;
  padding: 5px 12px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 0.76rem;
  box-shadow: var(--shadow);
}
.dl-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.dl-label { color: var(--text-muted); }
.dl-date { font-weight: 600; color: var(--text-primary); }

/* ── Section Header ── */
.sec-hd {
  font-size: 0.95rem; font-weight: 600;
  color: var(--text-secondary);
  padding-bottom: 7px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px; margin-top: 30px;
}

/* ── KPI Grid ── */
.kpi-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 20px; }
.kpi-card {
  background: var(--bg-card);
  border-left: 4px solid var(--accent);
  border-radius: 6px;
  padding: 17px 20px;
  box-shadow: var(--shadow);
  transition: background .22s;
}
.kpi-card.warn { border-left-color: var(--warn-text); }
.kpi-card.done-exp { border-left-color: var(--exp-text); }
.kpi-label { font-size: 0.72rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 5px; }
.kpi-val { font-size: 1.9rem; font-weight: 700; color: var(--kpi-value); line-height: 1.1; }
.kpi-card.warn .kpi-val { color: var(--warn-text); }
.kpi-card.done-exp .kpi-val { color: var(--exp-text); }
.kpi-sub { font-size: 0.72rem; color: var(--text-muted); margin-top: 4px; }

/* ── Progress Bar Card ── */
.prog-card {
  background: var(--bg-card);
  border-left: 4px solid var(--accent);
  border-radius: 6px;
  padding: 16px 20px;
  box-shadow: var(--shadow);
  margin-top: 14px;
}
.prog-hd { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.prog-title { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); }
.prog-pct { font-size: 0.95rem; font-weight: 700; color: var(--kpi-value); }
.bar-track { height: 9px; background: var(--border); border-radius: 5px; overflow: hidden; }
.bar-fill { height: 100%; display: flex; border-radius: 5px; }
.seg-done-pr  { background: var(--accent); }
.seg-will-pr  { background: var(--warn-text); opacity: .75; }
.seg-done-exp { background: var(--exp-text); opacity: .8; }
.seg-will-exp { background: var(--pipe-text); opacity: .65; }
.bar-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 9px; }
.bl-item { display: flex; align-items: center; gap: 5px; font-size: 0.72rem; color: var(--text-muted); }
.bl-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

/* ── Table Wrapper ── */
.tbl-wrap { background: var(--bg-card); border-radius: 6px; box-shadow: var(--shadow); overflow: hidden; }
.tbl-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 11px 16px; border-bottom: 1px solid var(--border);
}
.tbl-count { font-size: 0.76rem; color: var(--text-muted); }
.search-box {
  padding: 5px 11px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--bg-page);
  color: var(--text-primary);
  font-family: inherit; font-size: 0.8rem;
  width: 210px; outline: none;
  transition: border-color .18s;
}
.search-box:focus { border-color: var(--accent); }
.search-box::placeholder { color: var(--text-muted); }
table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
thead th {
  text-align: left; padding: 9px 13px;
  font-size: 0.72rem; font-weight: 600;
  color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em;
  border-bottom: 1px solid var(--border);
  cursor: pointer; user-select: none; white-space: nowrap;
  transition: color .15s;
}
thead th:hover { color: var(--accent); }
thead th.sorted { color: var(--accent); }
.si { margin-left: 3px; opacity: .4; }
.sorted .si { opacity: 1; }
tbody tr { border-bottom: 1px solid var(--border); cursor: pointer; transition: background .13s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--row-hover); }
tbody td { padding: 9px 13px; vertical-align: middle; }
.c-muted { color: var(--text-muted); }
.c-num { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.c-accent { color: var(--kpi-value); }
.c-warn { color: var(--warn-text); }
.c-danger { color: var(--danger-text); }
.c-exp { color: var(--exp-text); }
.truncate { max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── Badges ── */
.badge {
  display: inline-flex; align-items: center;
  padding: 2px 8px; border-radius: 4px;
  font-size: 0.7rem; font-weight: 500; white-space: nowrap; border: 1px solid transparent;
}
.b-ok      { background: var(--ok-bg);      color: var(--ok-text);      border-color: var(--ok-border); }
.b-warn    { background: var(--warn-bg);     color: var(--warn-text);    border-color: var(--warn-border); }
.b-danger  { background: var(--danger-bg);   color: var(--danger-text);  border-color: var(--danger-border); }
.b-neutral { background: var(--neutral-bg);  color: var(--neutral-text); border-color: var(--neutral-border); }
.b-pipe    { background: var(--pipe-bg);     color: var(--pipe-text);    border-color: var(--pipe-border); }
.b-exp     { background: var(--exp-bg);      color: var(--exp-text);     border-color: var(--exp-border); }

/* ── Drawer ── */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.32);
  z-index: 200; opacity: 0; pointer-events: none;
  transition: opacity .22s;
}
.overlay.open { opacity: 1; pointer-events: all; }
.drawer {
  position: fixed; top: 0; right: 0;
  width: 44vw; min-width: 420px; max-width: 680px;
  height: 100vh;
  background: var(--bg-card);
  z-index: 201;
  box-shadow: -6px 0 28px rgba(0,0,0,.18);
  transform: translateX(100%);
  transition: transform .26s cubic-bezier(.4,0,.2,1);
  display: flex; flex-direction: column; overflow: hidden;
}
.drawer.open { transform: translateX(0); }
.drw-hd {
  padding: 20px 22px 15px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; justify-content: space-between;
  flex-shrink: 0;
}
.drw-title { font-size: .98rem; font-weight: 700; }
.drw-sub { font-size: .74rem; color: var(--text-muted); margin-top: 2px; line-height: 1.4; }
.drw-close {
  background: none; border: none;
  font-size: 1.1rem; color: var(--text-muted);
  cursor: pointer; padding: 2px 6px; border-radius: 4px; line-height: 1;
}
.drw-close:hover { background: var(--row-hover); color: var(--text-primary); }
.drw-body { padding: 18px 22px; overflow-y: auto; flex: 1; }

.dkpi-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 16px; }
.dkpi {
  background: var(--bg-page);
  border-radius: 6px; padding: 11px 13px;
}
.dkpi .lbl { font-size: .68rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); }
.dkpi .val { font-size: 1.05rem; font-weight: 700; color: var(--kpi-value); margin-top: 2px; }
.dkpi .val.danger { color: var(--danger-text); }
.dkpi .val.warn { color: var(--warn-text); }
.dkpi .val.exp { color: var(--exp-text); }
.dkpi .val.neutral { color: var(--text-muted); font-size: .9rem; }

.drw-sec { font-size: .78rem; font-weight: 600; color: var(--text-secondary); border-bottom: 1px solid var(--border); padding-bottom: 5px; margin: 14px 0 10px; }

.tx-card {
  background: var(--bg-page);
  border-radius: 6px; padding: 11px 13px; margin-bottom: 9px;
}
.tx-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.tx-item-text { font-size: .8rem; font-weight: 500; line-height: 1.4; flex: 1; }
.tx-cost-text { font-size: .85rem; font-weight: 700; color: var(--kpi-value); white-space: nowrap; }
.tx-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; align-items: center; }
.tx-meta-item { font-size: .7rem; color: var(--text-muted); }
.no-tx { text-align: center; color: var(--text-muted); font-size: .8rem; padding: 20px 0; }

/* ── Tabs ── */
.tab-bar {
  background: var(--bg-header);
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
  display: flex;
  gap: 0;
  transition: background .22s, border-color .22s;
}
.tab-btn {
  padding: 11px 20px;
  font-family: inherit; font-size: 0.82rem; font-weight: 500;
  color: var(--text-muted);
  background: none; border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  transition: color .15s, border-color .15s;
  white-space: nowrap;
  margin-bottom: -1px;
}
.tab-btn:hover { color: var(--text-primary); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── KPI card danger variant ── */
.kpi-card.danger { border-left-color: var(--danger-text); }
.kpi-card.danger .kpi-val { color: var(--danger-text); }

/* ── Quarterly Bar Chart ── */
.qbar-card {
  background: var(--bg-card);
  border-left: 4px solid var(--accent);
  border-radius: 6px;
  padding: 18px 20px 14px;
  box-shadow: var(--shadow);
  margin-bottom: 8px;
}
.qbar-row { display: flex; align-items: center; gap: 14px; margin-bottom: 13px; }
.qbar-row:last-child { margin-bottom: 0; }
.qbar-qlabel {
  font-size: .78rem; font-weight: 700;
  color: var(--text-secondary);
  width: 22px; flex-shrink: 0;
}
.qbar-track {
  flex: 1; height: 26px;
  background: var(--border);
  border-radius: 4px; overflow: hidden;
  display: flex;
}
.qbar-seg { height: 100%; transition: width .4s; }
.qbar-seg.done-pr  { background: var(--accent); }
.qbar-seg.done-exp { background: var(--exp-text); opacity: .85; }
.qbar-seg.will-pr  { background: var(--warn-text); opacity: .75; }
.qbar-seg.remaining { background: var(--ok-bg); border-right: 1px solid rgba(0,137,123,.15); }
.qbar-seg.pending  { background: var(--neutral-bg); }
.qbar-meta {
  display: flex; flex-direction: column; align-items: flex-end;
  flex-shrink: 0; width: 76px;
}
.qbar-amount { font-size: .8rem; font-weight: 700; color: var(--text-primary); }
.qbar-amount.dim { color: var(--text-muted); font-weight: 400; }
.qbar-pct { font-size: .68rem; color: var(--text-muted); margin-top: 1px; }
.qbar-legend {
  display: flex; flex-wrap: wrap; gap: 14px;
  margin-top: 14px; padding-top: 12px;
  border-top: 1px solid var(--border);
}
.qbar-legend-item { display: flex; align-items: center; gap: 5px; font-size: .72rem; color: var(--text-muted); }
.qbar-legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

/* ── Tab Active Badge ── */
.tab-active-badge {
  display: inline-flex; align-items: center;
  padding: 1px 6px; border-radius: 3px;
  font-size: .62rem; font-weight: 600; letter-spacing: .03em;
  background: var(--ok-bg); color: var(--ok-text); border: 1px solid var(--ok-border);
  margin-left: 5px; vertical-align: middle;
}

/* ── Quarter Cells (Overview table) ── */
.q-cell { min-width: 110px; vertical-align: middle; }
.q-amount { font-size: .78rem; font-weight: 600; color: var(--kpi-value); }
.q-amount.dim { color: var(--text-muted); font-weight: 400; }
.q-mini-bar { height: 3px; background: var(--border); border-radius: 2px; margin: 4px 0 5px; overflow: hidden; }
.q-mini-fill { height: 100%; border-radius: 2px; transition: width .3s; }
.q-mini-fill.ok      { background: var(--accent); }
.q-mini-fill.pipe    { background: var(--pipe-text); }
.q-mini-fill.warn    { background: var(--warn-text); }
.q-mini-fill.danger  { background: var(--danger-text); }

/* Responsive */
@media (max-width: 960px) {
  .kpi-grid { grid-template-columns: repeat(2,1fr); }
  .drawer { width: 90vw; min-width: unset; }
  main { padding: 18px 16px 40px; }
  header { padding: 11px 16px; }
  .tab-bar { padding: 0 16px; }
}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>ME Budget FY27 &mdash; Tracker</h1>
    <p>Manager: Mike Downing &nbsp;&middot;&nbsp; OPEX &nbsp;&middot;&nbsp; Updated: <span id="today-date"></span></p>
  </div>
  <button class="mode-btn" id="modeBtn" onclick="toggleMode()">🌙 Dark</button>
</header>

<!-- Tab Bar -->
<div class="tab-bar">
  <button class="tab-btn active" id="tab-overview" onclick="switchTab('overview')">Overview</button>
  <button class="tab-btn" id="tab-Q1" onclick="switchTab('Q1')">Q1 <span class="tab-active-badge">Active</span></button>
  <button class="tab-btn" id="tab-Q2" onclick="switchTab('Q2')">Q2</button>
  <button class="tab-btn" id="tab-Q3" onclick="switchTab('Q3')">Q3</button>
  <button class="tab-btn" id="tab-Q4" onclick="switchTab('Q4')">Q4</button>
</div>

<main>

  <!-- ══ Tab: Overview ══ -->
  <div class="tab-panel active" id="panel-overview">

    <!-- KPI Cards -->
    <p class="sec-hd" style="margin-top:0">FY27 At a Glance</p>
    <div class="kpi-grid" id="ov-kpi" style="grid-template-columns:repeat(3,1fr)"></div>

    <!-- Quarterly Bar Chart -->
    <p class="sec-hd">Quarterly Budget Distribution</p>
    <div class="qbar-card" id="ov-chart"></div>

    <!-- Table -->
    <p class="sec-hd">Budget Code Overview</p>
    <div class="tbl-wrap">
      <div class="tbl-toolbar">
        <span class="tbl-count" id="ovCount">24 budget codes</span>
        <input class="search-box" type="text" placeholder="Search code / category…" id="ovSearch" oninput="filterOv()">
      </div>
      <table id="ovTable">
        <thead>
          <tr>
            <th onclick="sortTbl('ovTable','ovBody',0,this)">Code <span class="si">↕</span></th>
            <th onclick="sortTbl('ovTable','ovBody',1,this)">Category <span class="si">↕</span></th>
            <th onclick="sortTbl('ovTable','ovBody',2,this)">Content <span class="si">↕</span></th>
            <th>Q1</th>
            <th>Q2</th>
            <th>Q3</th>
            <th>Q4</th>
          </tr>
        </thead>
        <tbody id="ovBody"></tbody>
      </table>
    </div>
  </div>

  <!-- ══ Tab: Quarter (shared, rendered by JS) ══ -->
  <div class="tab-panel" id="panel-quarter">
    <div id="quarter-content"></div>
  </div>

</main>

<!-- Drawer -->
<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drw-hd">
    <div>
      <div class="drw-title" id="drwTitle">—</div>
      <div class="drw-sub"   id="drwSub">—</div>
    </div>
    <button class="drw-close" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drw-body" id="drwBody"></div>
</div>

<script>
// ── Quarter Data ──
const QUARTERS = {
  Q1: {

// ── Helpers ──
const usd   = n => n == null ? '—' : '$'+Number(n).toLocaleString('en-US',{maximumFractionDigits:0});
const usdSm = n => (!n || n===0) ? '—' : '$'+Number(n).toLocaleString('en-US',{maximumFractionDigits:0});
const pct   = (a,b) => b ? (a/b*100).toFixed(1)+'%' : '0%';

function statusBadge(d, noTx) {
  if (!d.budget_usd) return '<span class="badge b-neutral">No Budget</span>';
  if (noTx) return '<span class="badge b-neutral">Pending</span>';
  if (d.remaining === null) return '<span class="badge b-danger">Overbudget</span>';
  if (d.will_pr > 0 || d.will_expensify > 0) return '<span class="badge b-pipe">In Pipeline</span>';
  if (d.done_pr > 0 || d.done_expensify > 0) {
    return (1 - d.remaining/d.budget_usd) > 0.85
      ? '<span class="badge b-warn">Near Limit</span>'
      : '<span class="badge b-ok">Active</span>';
  }
  return '<span class="badge b-neutral">Unused</span>';
}

function planBadge(p) {
  const m = {'Done - PR':'<span class="badge b-ok">Done PR</span>','Done - Expensify':'<span class="badge b-exp">Done Exp</span>','Will PR':'<span class="badge b-pipe">Will PR</span>','Will Expensify':'<span class="badge b-warn">Will Exp</span>'};
  return m[p] || `<span class="badge b-neutral">${p}</span>`;
}

// ── Overview: cross-quarter cell builder ──
function qCellInfo(d, hasTx) {
  if (!d.budget_usd) return {label:'No Budget', cls:'b-neutral', barW:0, barCls:'', dim:true};
  if (!hasTx)        return {label:'Pending',   cls:'b-neutral', barW:0, barCls:'', dim:true};
  if (d.remaining === null) {
    const over = (d.done_pr+d.done_expensify+d.will_pr+d.will_expensify);
    return {label:'Overbudget', cls:'b-danger', barW:100, barCls:'danger', dim:false};
  }
  const used    = d.budget_usd - d.remaining;
  const usedPct = used / d.budget_usd;
  const barW    = Math.min(Math.max((d.done_pr+d.done_expensify+d.will_pr+d.will_expensify)/d.budget_usd*100, 0), 100);
  if (usedPct >= 0.85) return {label:'Near Limit', cls:'b-warn',    barW, barCls:'warn', dim:false};
  if (d.will_pr>0||d.will_expensify>0) return {label:'In Pipeline', cls:'b-pipe', barW, barCls:'pipe', dim:false};
  if (d.done_pr>0||d.done_expensify>0) return {label:'Active',      cls:'b-ok',   barW, barCls:'ok',   dim:false};
  return {label:'Unused', cls:'b-neutral', barW:0, barCls:'', dim:true};
}

function buildQCell(code, q) {
  const qData = QUARTERS[q];
  const d     = qData.overview.find(x => x.budget_code === code);
  const hasTx = qData.txns.length > 0;
  if (!d) return `<td class="q-cell c-muted">—</td>`;
  const {label, cls, barW, barCls, dim} = qCellInfo(d, hasTx);
  const amountStr = d.budget_usd ? usd(d.budget_usd) : '—';
  const bar = d.budget_usd && hasTx
    ? `<div class="q-mini-bar"><div class="q-mini-fill ${barCls}" style="width:${barW.toFixed(1)}%"></div></div>`
    : `<div style="height:3px;margin:4px 0 5px"></div>`;
  return `<td class="q-cell">
    <div class="q-amount ${dim?'dim':''}">${amountStr}</div>
    ${bar}
    <span class="badge ${cls}">${label}</span>
  </td>`;
}

  document.getElementById('drwTitle').textContent = `Budget Code ${code}`;
  document.getElementById('drwSub').innerHTML = `
    <span style="color:var(--text-muted);font-size:.74rem;display:block;margin-bottom:6px">${d.category} &nbsp;·&nbsp; ${d.category_content}</span>
    <select id="drw-q-sel" onchange="switchDrawerQ(this.value)"
      style="padding:3px 10px;border:1px solid var(--border);border-radius:4px;
             background:var(--bg-page);color:var(--text-primary);
             font-family:inherit;font-size:.78rem;font-weight:600;outline:none;cursor:pointer">
      <option value="Q1" selected>Q1 — Active</option>
      <option value="Q2">Q2</option>
      <option value="Q3">Q3</option>
      <option value="Q4">Q4</option>
    </select>
  `;
  renderDrawerOvBody('Q1');
  document.getElementById('overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}

function switchDrawerQ(q) {
  renderDrawerOvBody(q);
}

function renderDrawerOvBody(q) {
  const qData = QUARTERS[q];
  const d   = qData.overview.find(x => x.budget_code === drawerOvCode);
  const txs = qData.txns.filter(x => x.budget_code === drawerOvCode);
  document.getElementById('drwBody').innerHTML = buildDrawerBody(d, txs);
}

// ── Drawer (Quarter tab) ──
function openDrawerQ(code) {
  const qData = QUARTERS[activeQ];
  const d   = qData.overview.find(x => x.budget_code === code);
  const txs = qData.txns.filter(x => x.budget_code === code);
  document.getElementById('drwTitle').textContent = `Budget Code ${code}`;
  document.getElementById('drwSub').innerHTML =
    `<span style="color:var(--text-muted);font-size:.74rem">${d.category} &nbsp;·&nbsp; ${d.category_content}</span>
     <span class="badge b-ok" style="margin-left:8px">${activeQ}</span>`;
  document.getElementById('drwBody').innerHTML = buildDrawerBody(d, txs);
  document.getElementById('overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}
function closeDrawer() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}
document.addEventListener('keydown', e => { if(e.key==='Escape') closeDrawer(); });

// ── Sort ──
const sortState = {};
function sortTbl(tblId, bodyId, col, th) {
  const key = `${tblId}-${col}`;
  const asc = sortState[key] !== true;
  sortState[key] = asc;
  document.querySelectorAll(`#${tblId} thead th`).forEach(h=>h.classList.remove('sorted'));
  th.classList.add('sorted');
  th.querySelector('.si').textContent = asc ? '↑' : '↓';
  const tbody = document.getElementById(bodyId);
  Array.from(tbody.querySelectorAll('tr'))
    .sort((a,b)=>{
      const va = a.cells[col]?.textContent.replace(/[$,—]/g,'').trim()||'';
      const vb = b.cells[col]?.textContent.replace(/[$,—]/g,'').trim()||'';
      const na = parseFloat(va), nb = parseFloat(vb);
      if(!isNaN(na)&&!isNaN(nb)) return asc?na-nb:nb-na;
      return asc?va.localeCompare(vb):vb.localeCompare(va);
    })
    .forEach(r=>tbody.appendChild(r));
}

// ── Tab Switch ──
function switchTab(id) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  const isQuarter = ['Q1','Q2','Q3','Q4'].includes(id);
  const panelId = isQuarter ? 'panel-quarter' : 'panel-' + id;
  document.getElementById(panelId).classList.add('active');
  document.getElementById('tab-' + id).classList.add('active');
  if (isQuarter) renderQuarter(id);
  localStorage.setItem('vcb-tab', id);
}

// ── Mode Toggle ──
function toggleMode() {
  const html = document.documentElement;
  const next = html.getAttribute('data-theme')==='business-light'?'business-dark':'business-light';
  html.setAttribute('data-theme', next);
  document.getElementById('modeBtn').textContent = next==='business-light'?'🌙 Dark':'☀️ Light';
  localStorage.setItem('vcb-mode', next);
}

// ── Init ──
(function(){
  const savedMode = localStorage.getItem('vcb-mode');
  if(savedMode) {
    document.documentElement.setAttribute('data-theme', savedMode);
    document.getElementById('modeBtn').textContent = savedMode==='business-light'?'🌙 Dark':'☀️ Light';
  }
  document.getElementById('today-date').textContent = new Date().toISOString().slice(0,10);
  renderOverviewKpiAndChart();
  renderOv(ALL_CODES);
  const savedTab = localStorage.getItem('vcb-tab') || 'overview';
  switchTab(savedTab);
})();
</script>
